  default_prompt: "$plan-roadmap-learning을 사용해 daily-flow cursor와 learner evidence를 읽고 endpoint와 실제 다음 primary target을 구분한 뒤, 정적 module·milestone 맥락과 필요한 inline bridge, 정확한 다음 source 또는 직접 관련 practice를 읽기 전용으로 정해줘."
