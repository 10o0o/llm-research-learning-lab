interface:
  display_name: "현업형 학습 실습"
  short_description: "완료 session 또는 TIL에서 실습 modality를 판정합니다"
  default_prompt: "$suggest-learning-practice를 사용해 완료된 schema-v9 lesson session 또는 정확한 finalized TIL의 부족한 수행 근거를 확인하고 practice_action과 practice_mode를 정해줘. Local artifact는 metadata-v4 하나로 만들고 외부 challenge나 competition은 현재 공식 페이지 검증과 승인 경계를 지켜줘."
