interface:
  display_name: "Standalone 지식 갱신"
  short_description: "명시한 내 설명과 실행 artifact만 knowledge에 반영합니다"
  default_prompt: "$update-learning-knowledge를 사용해 현재 요청에서 지정한 내 설명, 계산, 실행하고 해석한 artifact만 읽어 knowledge를 0~3개 갱신하거나 NO_CHANGE로 끝내줘. ignored state를 읽거나 commit하지 마."
policy:
  allow_implicit_invocation: false
