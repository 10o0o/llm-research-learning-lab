[project]
name = "llm-research-learning-lab"
version = "0.1.0"
description = "A personal learning lab for becoming an LLM Research Engineer"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel",
    "nbformat>=5.11.1",
    "numpy",
    "torch",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
